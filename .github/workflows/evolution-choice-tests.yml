name: US5 Evolution Choice Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evolution-choice-tests:
    name: Run evolution choice unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript evolution choice tests
        run: node tests/us5/run-tests.cjs

      - name: Verify project build
        run: npm run build --if-present

      - name: Upload detailed test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evolution-choice-test-results
          path: test-results/evolution-choice-tests.txt
          if-no-files-found: warn
