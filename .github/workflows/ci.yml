
# Run on every push to any branch, and on every pull request into main.
# A PR should only be merged when this passes.
name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repo code onto the GitHub machine
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Install Node.js and cache npm downloads for faster runs
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install the exact versions from package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Check TypeScript types
      - name: Type check
        run: npm run typecheck

      # 5. Run all Vitest tests
      - name: Run tests
        run: npm test

      # 6. Build the site
      - name: Build
        run: npm run build
